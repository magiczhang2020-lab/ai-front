<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 热点新闻</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>AI 热点新闻</h1>
        <p id="last-updated">加载中...</p>
      </header>

      <section class="toolbar" aria-label="新闻筛选">
        <input id="search-input" type="search" placeholder="搜索标题或来源..." autocomplete="off" />
        <button id="sort-btn" type="button" data-sort="desc">按时间: 最新优先</button>
      </section>

      <section>
        <ul id="news-list" class="news-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
