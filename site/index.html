<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Front | Tech News</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="#">AI FRONT</a>
        <nav class="nav" aria-label="主导航">
          <a href="#">AI</a>
          <a href="#">Startups</a>
          <a href="#">Apps</a>
          <a href="#">Security</a>
          <a href="#">Venture</a>
        </nav>
      </div>
    </header>

    <main class="wrap page">
      <section class="controls" aria-label="新闻筛选">
        <input id="search-input" type="search" placeholder="Search headlines or source" autocomplete="off" />
        <select id="source-select">
          <option value="all">All sources</option>
        </select>
        <button id="sort-btn" type="button" data-sort="desc">Latest first</button>
      </section>

      <p id="last-updated" class="last-updated">Loading...</p>

      <section class="grid">
        <section class="main-column">
          <article id="lead-story" class="lead-story"></article>
          <ul id="secondary-list" class="secondary-list"></ul>
          <ul id="news-list" class="news-list"></ul>
        </section>

        <aside class="sidebar">
          <h2>Most Popular</h2>
          <p id="total-count" class="count">0 stories</p>
          <ol id="popular-list" class="popular-list"></ol>
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
